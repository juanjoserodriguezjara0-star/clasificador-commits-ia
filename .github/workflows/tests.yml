name: Pruebas de la API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar sintaxis
        run: python -m py_compile main.py test_main.py

      - name: Validar configuración Docker Compose
        run: docker compose config --quiet

      - name: Construir imagen de la API
        run: docker build --tag clasificador-commits-ia:test .

      - name: Ejecutar pruebas
        run: pytest -v
