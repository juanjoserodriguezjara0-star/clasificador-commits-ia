name: Validación de integración

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clasificador
          POSTGRES_USER: clasificador
          POSTGRES_PASSWORD: clasificador
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clasificador -d clasificador"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://clasificador:clasificador@localhost:5432/clasificador
      OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: mock-model

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inicializar esquema
        run: |
          PGPASSWORD=clasificador psql -h localhost -U clasificador -d clasificador -v ON_ERROR_STOP=1 -f db/init.sql

      - name: Iniciar simulador HTTP de Ollama
        run: |
          cat > /tmp/mock_ollama.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps({"models": [{"name": "mock-model"}]}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_POST(self):
                  size = int(self.headers.get("Content-Length", "0"))
                  payload = json.loads(self.rfile.read(size) or b"{}")
                  prompt = payload.get("prompt", "").lower()
                  category = "fix" if "corregir" in prompt or "error" in prompt else "feat"
                  body = json.dumps({"response": category, "done": True}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *_):
                  pass

          HTTPServer(("127.0.0.1", 11434), Handler).serve_forever()
          PY
          nohup python /tmp/mock_ollama.py >/tmp/mock-ollama.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:11434/api/tags && break
            sleep 1
          done

      - name: Arrancar API
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 >/tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && break
            sleep 1
          done

      - name: Probar integración API, base de datos y simulador
        run: |
          python - <<'PY'
          import json
          import urllib.request

          def request(path, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(
                  "http://127.0.0.1:8000" + path,
                  data=body,
                  headers={"Content-Type": "application/json"} if body else {},
              )
              with urllib.request.urlopen(req, timeout=15) as response:
                  return response.status, json.loads(response.read())

          status, health = request("/health")
          assert status == 200, health
          assert health["postgresql"] == "ok", health
          assert health["ollama"] == "ok", health

          status, record = request("/clasificar", {"mensaje": "fix: corregir error de acceso"})
          assert status == 200, record
          assert record["categoria"] == "fix", record
          assert record.get("id"), record

          status, history = request("/inferencias?limite=10")
          assert status == 200, history
          assert history["total"] >= 1, history
          assert any(item["id"] == record["id"] for item in history["inferencias"]), history
          print("Integración API + PostgreSQL + simulador de Ollama: aprobada")
          print("Aviso: Ollama se simula en este workflow; no se ejecuta el modelo real.")
          PY

      - name: Verificar respaldo y restauración de PostgreSQL
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pg-backup"
          docker run --rm --network host \
            -e PGPASSWORD=clasificador \
            -v "$RUNNER_TEMP/pg-backup:/backup" \
            postgres:16-alpine sh -ec '
              pg_dump -h localhost -U clasificador -d clasificador -Fc -f /backup/clasificador.dump
              createdb -h localhost -U clasificador clasificador_restore_test
              pg_restore -h localhost -U clasificador -d clasificador_restore_test --clean --if-exists /backup/clasificador.dump
              COUNT=$(psql -h localhost -U clasificador -d clasificador_restore_test -tAc "SELECT count(*) FROM inferencias")
              test "$COUNT" -ge 1
              echo "Respaldo y restauración aprobados; registros restaurados: $COUNT"
            '

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Prueba de humo de carga
        run: k6 run tests/load.js
